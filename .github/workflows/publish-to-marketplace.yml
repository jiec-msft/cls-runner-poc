---
name: Publish to Marketplace

# Mirrors the jb (microsoft/copilot-intellij) publish flow:
#  - workflow_dispatch with a channel (stable | nightly) + visibility (hidden | visible);
#  - nightly bumps the patch and appends -nightly.<run_number> so it sorts ABOVE the latest
#    stable in JetBrains' version comparison (see jb release.yml). Otherwise a -nightly
#    pre-release of the SAME version would sort below stable and nightly users would never
#    be offered the update;
#  - build (legacy fat/slims or Gradle native variants) is decoupled from upload;
#    upload is curl -> /plugin/uploadPlugin
#    with -F channel + isHidden + retry (.github/actions/publish-to-marketplace).
#
# NOTE: the FIRST upload of a brand-new plugin must be done once via the web UI
# (https://plugins.jetbrains.com/plugin/add) to create the listing. After that, set the
# numeric `plugin_id` input (or rely on xmlId) and this workflow handles every version.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'JetBrains Marketplace channel'
        type: choice
        required: true
        default: nightly
        options:
          - nightly
          - stable
      visibility:
        description: 'Publish as hidden or visible'
        type: choice
        required: true
        default: hidden
        options:
          - hidden
          - visible
      release_version:
        description: 'Core version. stable uses it as-is; nightly bumps patch + appends -nightly.<run>'
        type: string
        required: true
        default: '1.13.1'
      build_mode:
        description: 'split = manual fat + slims; universal = legacy fat; nativeVariants = six variants; nativeVariantsFallback = ranked 261 fallback + 2026.1.5 variants.'
        type: choice
        required: true
        default: split
        options:
          - split
          - universal
          - nativeVariants
          - nativeVariantsFallback
      plugin_id:
        description: 'Numeric Marketplace plugin id (preferred; defaults to the cls-runner listing)'
        type: string
        required: false
        default: '32412'
      dry_run:
        description: 'Build only — skip the Marketplace upload (validate the pipeline safely)'
        type: boolean
        required: false
        default: false
      confirm_visible:
        description: 'For a visible nativeVariants upload, type publish-visible-nightly'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build plugin distributions and publish (${{ inputs.channel }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node (for npm pack of CLS binaries)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate native variants publication guard
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          CHANNEL: ${{ inputs.channel }}
          VISIBILITY: ${{ inputs.visibility }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_VISIBLE: ${{ inputs.confirm_visible }}
        run: |
          set -euo pipefail
          if [ "$BUILD_MODE" != "nativeVariants" ] &&
             [ "$BUILD_MODE" != "nativeVariantsFallback" ]; then
            exit 0
          fi
          if [ "$CHANNEL" != "nightly" ]; then
            echo "::error::nativeVariants POC publication is restricted to the nightly channel"
            exit 1
          fi
          if [ "$DRY_RUN" = "false" ] && [ "$VISIBILITY" = "visible" ] &&
             [ "$CONFIRM_VISIBLE" != "publish-visible-nightly" ]; then
            echo "::error::Visible nativeVariants publication requires confirm_visible=publish-visible-nightly"
            exit 1
          fi

      - name: Compute version
        id: ver
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CHANNEL: ${{ inputs.channel }}
          BUILD_MODE: ${{ inputs.build_mode }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "nightly" ]; then
            MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
            PATCH=$(echo "$RELEASE_VERSION" | cut -d. -f3 | cut -d- -f1)
            NEXT=$((PATCH + 1))
            # e.g. stable 1.13.0 -> nightly core 1.13.1-nightly.<run>  (> 1.13.0)
            CORE="${MAJOR}.${MINOR}.${NEXT}-nightly.${RUN_NUMBER}"
          else
            CORE="$RELEASE_VERSION"
          fi
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          if [ "$BUILD_MODE" = "universal" ]; then
            echo "Core version: $CORE  ->  universal ${CORE} (2025.1.1+, no cap)"
          elif [ "$BUILD_MODE" = "nativeVariants" ]; then
            echo "Core version: $CORE  ->  Gradle variants ${CORE}-261-{os}-{arch}"
          elif [ "$BUILD_MODE" = "nativeVariantsFallback" ]; then
            echo "Core version: $CORE  ->  ${CORE}-261 fallback + ${CORE}-261-{os}-{arch} variants"
          else
            echo "Core version: $CORE  ->  fat ${CORE}-251 / slims ${CORE}-261-{os}-{arch}"
          fi

      - name: Download CLS binaries (all 6 platforms)
        shell: pwsh
        run: ./scripts/download-binaries.ps1

      - name: Build plugin ZIP(s)
        shell: bash
        env:
          CORE: ${{ steps.ver.outputs.core }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          chmod +x ./gradlew
          case "$BUILD_MODE" in
            universal)
              ./gradlew buildPlugin -PuniversalBuild=true -PpocBaseVersion="$CORE" --no-daemon --console=plain
              ;;
            nativeVariants)
              ./gradlew clean cleanSandbox buildPlugin buildPluginVariants prepareSandbox_runIde \
                -PnativeVariants=true -PpocBaseVersion="$CORE" --no-daemon --console=plain
              ;;
            nativeVariantsFallback)
              FALLBACK_DIR="$RUNNER_TEMP/native-fallback"
              mkdir -p "$FALLBACK_DIR"
              ./gradlew clean buildPlugin \
                -PnativeFallback=true -PnativeSinceBuild=261 -PpocBaseVersion="$CORE" \
                --no-daemon --console=plain
              cp "build/distributions/cls-runner-${CORE}-261.zip" "$FALLBACK_DIR/"

              ./gradlew clean cleanSandbox buildPluginVariants prepareSandbox_runIde \
                -PnativeVariants=true -PnativeSinceBuild=261.27258 -PpocBaseVersion="$CORE" \
                --no-daemon --console=plain
              mkdir -p build/distributions
              cp "$FALLBACK_DIR/cls-runner-${CORE}-261.zip" build/distributions/
              ;;
            split)
              ./gradlew buildNativePlugins -PpocBaseVersion="$CORE" --no-daemon --console=plain
              ;;
          esac

      - name: Verify native variant distributions
        if: ${{ inputs.build_mode == 'nativeVariants' || inputs.build_mode == 'nativeVariantsFallback' }}
        shell: pwsh
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          if ($env:BUILD_MODE -eq "nativeVariantsFallback") {
            ./scripts/verify-zips.ps1 -RequireNativeVariants -RequireNightlyFallback
          } else {
            ./scripts/verify-zips.ps1 -RequireNativeVariants
          }

      - name: Verify Linux x86_64 runIde sandbox
        if: ${{ inputs.build_mode == 'nativeVariants' || inputs.build_mode == 'nativeVariantsFallback' }}
        shell: bash
        env:
          CORE: ${{ steps.ver.outputs.core }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          set -euo pipefail
          PLUGIN_ROOT=$(find .intellijPlatform/sandbox -type d \
            -path '*/plugins_runIde/cls-runner' -print -quit)
          test -n "$PLUGIN_ROOT"

          mapfile -t NATIVE_DIRS < <(find "$PLUGIN_ROOT/copilot-agent/native" \
            -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          test "${#NATIVE_DIRS[@]}" -eq 1
          test "${NATIVE_DIRS[0]}" = "linux-x64"

          JAR=$(find "$PLUGIN_ROOT/lib" -maxdepth 1 -name 'cls-runner-*.jar' -print -quit)
          unzip -p "$JAR" META-INF/plugin.xml > "$RUNNER_TEMP/plugin.xml"
          grep -F "<version>${CORE}-261-linux-x86_64</version>" "$RUNNER_TEMP/plugin.xml"
          grep -F '<depends>com.intellij.modules.os.linux</depends>' "$RUNNER_TEMP/plugin.xml"
          grep -F '<depends>com.intellij.modules.arch.x86_64</depends>' "$RUNNER_TEMP/plugin.xml"

      - name: Verify publishPlugin selects variants
        if: ${{ inputs.build_mode == 'nativeVariants' || inputs.build_mode == 'nativeVariantsFallback' }}
        shell: bash
        env:
          CORE: ${{ steps.ver.outputs.core }}
        run: |
          set -euo pipefail
          ./gradlew publishPlugin -PnativeVariants=true -PpocBaseVersion="$CORE" \
            --dry-run --no-daemon --console=plain | tee "$RUNNER_TEMP/publish-plugin-dry-run.txt"
          grep -F ':buildPluginVariants' "$RUNNER_TEMP/publish-plugin-dry-run.txt"

      - name: List built ZIPs
        shell: bash
        run: find build -name 'cls-runner-*.zip' -type f -printf '%f\t%s bytes\n' | sort

      - name: Publish to JetBrains Marketplace
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/publish-to-marketplace
        with:
          marketplaceToken: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          channel: ${{ inputs.channel }}
          hidden: ${{ inputs.visibility == 'hidden' && 'true' || 'false' }}
          pluginId: ${{ inputs.plugin_id }}
          excludeFile: ${{ inputs.build_mode == 'nativeVariants' && format('cls-runner-{0}-261.zip', steps.ver.outputs.core) || '' }}

      - name: Verify Marketplace accepted all native variants
        if: ${{ !inputs.dry_run && (inputs.build_mode == 'nativeVariants' || inputs.build_mode == 'nativeVariantsFallback') }}
        shell: bash
        env:
          CORE: ${{ steps.ver.outputs.core }}
          PLUGIN_ID: ${{ inputs.plugin_id }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          set -euo pipefail
          SUFFIXES=(linux-arm64 linux-x86_64 mac-arm64 mac-x86_64 windows-arm64 windows-x86_64)
          VARIANT_SINCE="261.0"
          FALLBACK_VERSION="${CORE}-261"
          if [ "$BUILD_MODE" = "nativeVariantsFallback" ]; then
            VARIANT_SINCE="261.27258"
          fi
          for attempt in $(seq 1 20); do
            JSON=$(curl --fail --silent --show-error \
              "https://plugins.jetbrains.com/api/plugins/${PLUGIN_ID}/updates?channel=nightly")
            MISSING=0
            for suffix in "${SUFFIXES[@]}"; do
              jq -e --arg version "${CORE}-261-${suffix}" \
                --arg since "$VARIANT_SINCE" \
                'any(.[]; .version == $version and .channel == "nightly" and .since == $since)' \
                <<<"$JSON" >/dev/null || MISSING=1
            done
            if [ "$BUILD_MODE" = "nativeVariantsFallback" ]; then
              jq -e --arg version "$FALLBACK_VERSION" \
                'any(.[]; .version == $version and .channel == "nightly" and
                  .since == "261.0" and .until == "261.26222.*")' \
                <<<"$JSON" >/dev/null || MISSING=1
            fi
            [ "$MISSING" -eq 0 ] && exit 0
            echo "Marketplace metadata is not complete yet (attempt $attempt/20)"
            sleep 30
          done
          echo "::error::Marketplace did not expose all six native variants"
          exit 1

      - name: Upload ZIPs as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cls-runner-${{ steps.ver.outputs.core }}
          path: |
            build/distributions/cls-runner-*.zip
            build/native-distributions/cls-runner-*.zip
          if-no-files-found: warn
          retention-days: 7
